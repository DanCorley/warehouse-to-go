[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warehouse-to-go"
version = "0.2.0"
description = "Tool to create local DuckDB representations of data warehouse sources from dbt projects"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb==1.5.5",
    "pyarrow>=17.0.0",
    "snowflake-connector-python[pandas]==4.2.0",
    "cryptography==44.0.2",
    "PyYAML==6.0.1",
    "typer>=0.15.2",
    "click>=8.0,<9.0",
    "rich==14.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[project.scripts]
warehouse-to-go = "warehouse_to_go.cli:app"

# Adapter discovery. package is discovered here via an
# entry-point group (PEP 682). Add a new line module path per dialect
[project.entry-points."warehouse_to_go.adapters"]
snowflake = "warehouse_to_go.warehouse.snowflake_adapter"

[tool.setuptools.packages.find]
where = ["."]
include = ["warehouse_to_go*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
warehouse-to-go = { workspace = true }

[dependency-groups]
dev = [
    "warehouse-to-go",
]
