name: Test

# Runs on every pull_request event, which fires when a PR is opened and on
# every subsequent push to that branch while the PR is still open.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies and dev tools
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest
