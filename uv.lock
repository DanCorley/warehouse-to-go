source = { editable = "." }
dependencies = [
    { name = "click" },
    { name = "cryptography" },
    { name = "duckdb" },
    { name = "pyarrow" },
    { name = "pyyaml" },
    { name = "rich" },
    { name = "snowflake-connector-python", extra = ["pandas"] },
    { name = "typer" },
]

[package.metadata]
requires-dist = [
    { name = "click", specifier = ">=8.0,<9.0" },
    { name = "cryptography", specifier = "==44.0.2" },
    { name = "duckdb", specifier = "==1.2.1" },
    { name = "pyarrow", specifier = ">=17.0.0" },
    { name = "pyyaml", specifier = "==6.0.1" },
    { name = "rich", specifier = "==14.0.0" },
    { name = "snowflake-connector-python", extras = ["pandas"], specifier = "==4.2.0" },
    { name = "typer", specifier = ">=0.15.2" },
]
